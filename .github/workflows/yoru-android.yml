name: YORU Android signed APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout YORU
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Restore Android signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.YORU_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_KEY_BASE64:-}" || { echo 'Missing YORU_ANDROID_KEYSTORE_BASE64 secret'; exit 1; }
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > android/yoru-android-signing.jks
          chmod 600 android/yoru-android-signing.jks
      - name: Install Bubblewrap (pinned)
        run: npm install --global @bubblewrap/cli@1.27.0
      - name: Generate Android project from manifest
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade
      - name: Build signed APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.YORU_ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.YORU_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${BUBBLEWRAP_KEYSTORE_PASSWORD:-}" || { echo 'Missing keystore password secret'; exit 1; }
          test -n "${BUBBLEWRAP_KEY_PASSWORD:-}" || { echo 'Missing key password secret'; exit 1; }
          bubblewrap build --skipPwaValidation
          test -s app-release-signed.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: YORU-Android-APK
          path: android/app-release-signed.apk
          retention-days: 30
